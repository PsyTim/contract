<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a4f">
  <title>Разработка веб-сайтов — прайс-лист</title>
  <meta name="description" content="Прайс-лист услуг по разработке веб-сайтов.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8f8ff;
      background:
        radial-gradient(circle at 8% 15%, rgba(255, 108, 96, .55), transparent 25rem),
        radial-gradient(circle at 90% 85%, rgba(49, 112, 255, .55), transparent 30rem),
        linear-gradient(145deg, #12194e 0%, #30125b 55%, #10142e 100%);
    }
    main { width: min(100%, 760px); text-align: center; }
    h1 { margin: 0 0 10px; font-size: clamp(1.55rem, 4vw, 2.35rem); letter-spacing: -.03em; }
    p { margin: 0 0 24px; color: #d8d9ff; font-size: 1rem; }
    figure {
      margin: 0;
      padding: clamp(9px, 2vw, 15px);
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 25px;
      box-shadow: 0 25px 80px rgba(0,0,0,.34);
      backdrop-filter: blur(12px);
    }
    img { display: block; width: 100%; height: auto; border-radius: 17px; }
    a {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 18px;
      color: #111a50;
      text-decoration: none;
      font-weight: 800;
      border-radius: 999px;
      background: #fff;
    }
    a:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <h1>Разработка веб-сайтов</h1>
    <p>Прайс-лист услуг</p>
    <figure>
      <img src="website_services_price_card.png" alt="Прайс-лист услуг по разработке веб-сайтов">
    </figure>
    <a href="website_services_price_card.png" download>Скачать карточку PNG</a>
  </main>
</body>
</html>
